{{- if and .IsPage (in .RawContent "$") -}}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["$", "$"], ["\\(", "\\)"]],
      displayMath: [["$$", "$$"], ["\\[", "\\]"]],
      processEscapes: true,
      tags: "ams"
    },
    options: {
      skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
    }
  };
</script>
<script
  defer
  src="https://cdn.jsdelivr.net/npm/mathjax@4.1.2/tex-mml-chtml.js"
  referrerpolicy="no-referrer"
></script>
{{- end -}}
